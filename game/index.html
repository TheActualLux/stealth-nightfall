<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071516">
<title>Nightfall Rookery</title>
<style>
  :root { color-scheme: dark; background: #071516; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071516; }
  body { display: grid; place-items: center; }
  #game { width: min(100vw, 150vh); height: min(100vh, 66.6667vw); display: block; touch-action: none; outline: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="960" height="640" tabindex="0" aria-label="Nightfall Rookery, a top-down stealth game. Use the keyboard and mouse to cross the night garden unseen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
